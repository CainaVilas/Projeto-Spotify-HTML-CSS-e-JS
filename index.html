<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/17cf03ac5e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <title>DevCainã - Music</title>
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <div class="nav-logo">
                <i class="fa-brands fa-spotify"></i>
            </div>
            <div class="nav-library">
                <i class="fa-solid fa-book-open"></i>
                <p>Sua Biblioteca +</p>
            </div>
            <div class="nav-playlist">
                <h5>Crie sua Playlist</h5>
                <p>È Facil, Vamos te ajudar</p>
                <button> Criar Playlist</button>
            </div>
            <div class="nav-podcast">
                <h5>Que tal seguir um podcast?</h5>
                <p>Descubra novos podcasts e acompanhe seus favoritos</p>
                <button>Explorar Podcasts</button>
            </div>
            <div class="nav-footer">
                <a href="#">Legal</a>
                <a href="#">Centro de Ajuda</a>
                <a href="#">Termos de Uso</a>
                <a href="#">Privacy</a>
                <a href="#">Cookies</a>
                <a href="#">Publicidade</a>
                <a href="#">Parceiros</a>
                <a href="#">Acessibilidade</a>
            </div>
            <button class="nav-lang-button">
                <i class="fa-solid fa-globe"></i>
                Português do Brasil
            </button>
        </nav>  
        <main>
            <header>
                <i class="fa-solid fa-magnifying-glass"></i>
                <input placeholder="O que você quer ouvir?" type="text">
            </header>
            <section class="popular-artists">
                <h2>Artistias Populares</h2>
                <div class="artists-grid">
                    <!--Inserir dados com Js-->
                </div>    

                <h2>Albuns</h2>
                <div class="albums-grid">
                    <!--Inserir dados com Js-->
                </div>
            </section>
        </main>  
    </div>
</body>
</html>
